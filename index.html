<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>材料化学实验方案智能生成助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft Yahei", sans-serif; }
        body { background: #f5f7fa; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; color: #1a365d; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="password"], textarea, select {
            width: 100%; padding: 12px; border: 1px solid #dcdfe6; border-radius: 8px;
            font-size: 14px; outline: none; transition: border-color 0.3s;
        }
        input:focus, textarea:focus { border-color: #409eff; }
        textarea { min-height: 120px; resize: vertical; }
        .btn {
            width: 100%; padding: 14px; background: #409eff; color: white; border: none;
            border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s;
        }
        .btn:hover { background: #66b1ff; }
        .btn:disabled { background: #a0cfff; cursor: not-allowed; }
        .result-box {
            margin-top: 20px; padding: 20px; background: #f0f9ff; border-radius: 8px;
            line-height: 1.8; white-space: pre-wrap; display: none;
        }
        .tip { font-size: 12px; color: #909399; margin-top: 6px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>材料化学实验方案智能生成助手</h1>
        <p>基于qwen3.7-plus的专业实验设计智能体</p>
    </div>

    <div class="card">
        <div class="input-group">
            <label>阿里云API-KEY</label>
            <input type="password" id="apiKey" placeholder="请输入你的DashScope API-KEY">
            <p class="tip">密钥仅保存在本地浏览器，不会上传到任何服务器</p>
        </div>

        <div class="input-group">
            <label>功能选择</label>
            <select id="functionType">
                <option value="experiment">实验方案生成</option>
                <option value="dosage">试剂用量计算</option>
                <option value="analysis">实验结果分析</option>
            </select>
        </div>

        <div class="input-group">
            <label>输入你的需求</label>
            <textarea id="userInput" placeholder="示例：设计一个制备纳米铝热剂的完整实验方案，包含试剂、步骤、安全事项"></textarea>
        </div>

        <button class="btn" id="submitBtn" onclick="runAgent()">生成结果</button>

        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        // 工具1：试剂用量计算器
        function calculateDosage(reagent, concentration, volume) {
            // 简化版：根据物质的量浓度计算质量
            const molarMass = {
                "硝酸铜": 187.56, "硫酸铜": 159.61, "氯化钠": 58.44,
                "铝粉": 26.98, "氧化铁": 159.69, "高锰酸钾": 158.03
            };
            const mass = molarMass[reagent] * concentration * volume / 1000;
            return `${reagent} 所需质量：${mass.toFixed(3)} g（浓度${concentration}mol/L，体积${volume}mL）`;
        }

        // 系统提示词（内置知识库：实验规范+安全要求）
        const systemPrompt = `
你是一名资深材料化学实验专家，严格遵循以下规则回答问题：
【知识库-安全规范】
1. 所有涉及易燃易爆试剂的实验必须标注通风橱操作、防护装备要求
2. 铝热剂等危险实验必须注明点火方式、安全距离、应急处理方案
3. 试剂取用遵循“少量多次”原则，强氧化性试剂与还原剂分开存放
【知识库-实验标准】
1. 固体试剂用电子天平称量，精确到0.001g；液体用量筒或移液枪
2. 加热实验优先用油浴或水浴，禁止明火直接加热易燃试剂
3. 产物表征优先推荐XRD、SEM、DSC-TGA等常用手段

你可以调用内置工具：
- 函数名：calculate_dosage
- 功能：计算试剂所需质量
- 输入格式：[{"name":"calculate_dosage","parameters":{"reagent":"试剂名","concentration":浓度数值,"volume":体积数值}}]
- 调用后等待工具返回结果，再继续生成完整答案。

回答结构清晰，分点阐述，专业严谨。
        `;

        async function callQwen(messages) {
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('请先输入API-KEY');
                return null;
            }

            const response = await fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "qwen3.7-plus",
                    messages: messages,
                    temperature: 0.3
                })
            });

            const data = await response.json();
            if (data.error) {
                alert("调用失败：" + data.error.message);
                return null;
            }
            return data.choices[0].message.content;
        }

        async function runAgent() {
            const btn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            const userInput = document.getElementById('userInput').value.trim();
            const funcType = document.getElementById('functionType').value;

            if (!userInput) {
                alert('请输入你的需求');
                return;
            }

            btn.disabled = true;
            btn.textContent = "智能体思考中...";
            resultBox.style.display = "block";
            resultBox.textContent = "正在分析需求、调用知识库...";

            // 构建首轮对话
            let messages = [
                { role: "system", content: systemPrompt },
                { role: "user", content: `功能类型：${funcType}\n用户需求：${userInput}` }
            ];

            // 第一次调用LLM
            let firstReply = await callQwen(messages);
            if (!firstReply) {
                btn.disabled = false;
                btn.textContent = "生成结果";
                return;
            }

            // 检测是否需要调用工具
            if (firstReply.includes("")) {
                resultBox.textContent = "正在调用计算工具...";
                
                // 解析工具调用参数
                const funcMatch = firstReply.match(/"reagent":"(.*?)","concentration":(.*?),"volume":(.*?)}/);
                if (funcMatch) {
                    const reagent = funcMatch[1];
                    const conc = parseFloat(funcMatch[2]);
                    const vol = parseFloat(funcMatch[3]);
                    const toolResult = calculateDosage(reagent, conc, vol);

                    // 把工具结果返回给LLM，生成最终答案
                    messages.push({ role: "assistant", content: firstReply });
                    messages.push({ role: "function", name: "calculate_dosage", content: toolResult });
                    
                    const finalReply = await callQwen(messages);
                    resultBox.textContent = finalReply;
                }
            } else {
                resultBox.textContent = firstReply;
            }

            btn.disabled = false;
            btn.textContent = "生成结果";
        }
    </script>
</body>
</html>
